<!doctype html>
<!-- 纸面编辑部 · 3D 立体书：1.mp4（调色版）0–13 秒，末尾定格补到 13.4 秒。
     "高认知穷人，其实是缺少向外输出 / 我们改变自己的方式通常是早起、运动、读书 / 但这些都是内部循环，只是基本要求 / 若止步于此，处境不会发生改变"
     地板上的位置（世界 x, z）：一镜 书塔 (800,-385)；二镜 三个格子 (2700/3050/3400,-300)；三四镜 圆环和栅栏围着它们，门在 (4000,-850)。
     10 秒样片（向外输出那段）备份在 index_ep90_sample.html，平面版在 index_flat.html。 -->

<style>
#view{position:absolute;inset:0;perspective:1500px;perspective-origin:960px 540px;overflow:hidden;background:linear-gradient(#e9e5db 0%,#F3F0E8 60%)}

#page{position:absolute;left:-1500px;top:800px;width:7500px;height:4600px;transform-origin:0 0;transform:translateZ(1200px) rotateX(-90deg);transform-style:preserve-3d;
 background:linear-gradient(90deg,rgba(20,20,20,.06) 0 2px,transparent 2px) 0 0/300px 300px,linear-gradient(rgba(20,20,20,.06) 0 2px,transparent 2px) 0 0/300px 300px,url(assets/paper.jpg) 0 0/3400px 2400px}
#wall{filter:blur(3px);position:absolute;left:-1500px;top:-2600px;width:7500px;height:3400px;transform:translateZ(-3300px);
 background:linear-gradient(#e2ddd1,#efebe2 70%,#F3F0E8),url(assets/paper.jpg) 0 0/3400px 2400px;background-blend-mode:multiply}
.g3{position:absolute;left:0;top:0;transform-style:preserve-3d}
.sh{border-radius:50%;background:radial-gradient(closest-side,rgba(40,25,10,.32),rgba(40,25,10,0))}

.pcard{box-shadow:0 2px 0 rgba(20,20,20,.08),0 16px 28px rgba(60,40,20,.2)}

#outIn{position:absolute;inset:0;background:var(--acc);border-radius:6px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
#outIn .eye{position:absolute;top:24px;width:10px;height:14px;background:#141414;border-radius:5px}
#outIn .eye.l{left:22px}#outIn .eye.r{left:42px}
.slot{border:5px dashed rgba(20,20,20,.45);border-radius:50%}
#horizon{background:linear-gradient(#fefdf9,#ece6da);border:5px solid var(--ink);border-bottom:none;border-radius:6px 6px 0 0}

.cushion{background:radial-gradient(#fffaf3,#f1e3d1);border:5px dashed rgba(20,20,20,.35);border-radius:46px}
.mini{background:#fbf9f4;border:4px solid #141414;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 40px/1 MiSans;color:#141414}
.wall{background:repeating-linear-gradient(45deg,rgba(20,20,20,.07) 0 2px,transparent 2px 24px),repeating-linear-gradient(-45deg,rgba(20,20,20,.07) 0 2px,transparent 2px 24px),linear-gradient(#fffaf2,#efe4d4);border:4px solid var(--ink);border-bottom:none;border-radius:16px 16px 0 0}

.exam s{position:absolute;right:16px;top:12px;font:900 44px/1 MiSans;color:var(--acc);text-decoration:none}

</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12.5" data-width="1920" data-height="1080">
  <div id="view"><div id="world">

    <div id="page">
      <div class="sh" id="outSh"></div>
      <div id="out"><div id="outIn"><i class="eye l"></i><i class="eye r"></i></div></div>
    </div>
  </div></div>
  <div class="hud" id="vig" style="left:0;top:0;width:1920px;height:1080px;z-index:5;background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 55%,rgba(60,40,20,.16) 100%)"></div>
  <div class="hud photo pcard" id="photo" style="left:120px;top:130px;width:330px;height:420px;transform:rotate(-2deg)"><div class="in"><video id="talkA" class="clip" src="assets/talk.mp4" muted playsinline data-start="0" data-duration="12.5" data-track-index="1" style="left:-21px;top:-77px;width:350px;height:622px"></video></div></div>
  <div class="hud photo pcard" id="sticker" style="left:110px;top:130px;width:250px;height:250px"><div class="in"><video id="talkB" class="clip" src="assets/talk.mp4" muted playsinline data-start="0" data-duration="12.5" data-track-index="3" style="left:-15px;top:-75px;width:265px;height:471px"></video></div></div>
  <div class="hud" id="tag"><i></i>苏格拉丁</div>

  <div id="fade"></div>
  <!-- sfx:begin -->

  <audio id="sfx-02-draw" src="assets/sfx_paper/draw_1.wav" data-start="1.490" data-duration="0.450" data-track-index="7" data-volume="0.16"></audio>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const { stand, flat, side } = Stage3D;
  const tl = gsap.timeline({ paused: true });
  const W = (id, ch, n = 1) => window.CAPS.find((c) => c.id === id).u.filter((x) => x[0][0] === ch)[n - 1][1];
  const PG = $("#page");
  const mk = (cls, html = "") => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; PG.appendChild(el); return el; };
  const popUp = (el, t, d = 0.5) => { tl.fromTo(el, { rotationX: 0 }, { rotationX: 90, duration: d, ease: "back.out(1.6)" }, t); tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08 }, t); };
  const foldDown = (el, t, d = 0.35) => { tl.to(el, { rotationX: 0, duration: d, ease: "power2.in" }, t); tl.to(el, { autoAlpha: 0, duration: 0.05 }, t + d); };
  const printAt = (el, t, d = 0.3) => tl.fromTo(el, { rotationX: 180, autoAlpha: 0, scale: 1.2 }, { rotationX: 180, autoAlpha: 1, scale: 1, duration: d, ease: "power3.out" }, t);
  function block(parent, x, z, w, d, h, frontBg) {
    const g = document.createElement("div"); g.className = "g3"; parent.appendChild(g);
    const f = document.createElement("div"); f.className = "front"; f.style.background = frontBg; g.appendChild(f); stand(f, x, z, w, h);
    const tp = document.createElement("div"); tp.className = "top"; g.appendChild(tp); flat(tp, x, z - d / 2, w, d); gsap.set(tp, { z: -h });
    const sd = document.createElement("div"); sd.className = "sideF"; g.appendChild(sd); side(sd, x + w / 2, z, z - d, h);
    return g;
  }
  const lines = (n, top = 26, gap = 22) => Array.from({ length: n }, (_, i) => `<i style="top:${top + i * gap}px"></i>`).join("");
  const paleBlock = (x, z, w, d, h) => { const g = block(PG, x, z, w, d, h, "linear-gradient(#f8f6f0,#ece7dc)"); g.querySelectorAll("div").forEach((e) => { e.style.borderColor = "rgba(20,20,20,.16)"; e.style.borderWidth = "3px"; }); g.querySelector(".sideF").style.background = "#e8e3d8"; return g; };
  const bgCard = (x, z, w, h, yaw = 0) => { const el = mk("bgc", lines(Math.max(2, Math.floor(h / 40)))); stand(el, x, z, w, h, { yaw }); return el; };
  const fgCard = (x, z, w, h, yaw = 0) => { const el = mk("fgc"); stand(el, x, z, w, h, { yaw }); return el; };
  const fgFlat = (x, z, w, d, lift = 0, rot = 0) => { const el = mk("fgf", lines(3, 30, 34)); flat(el, x, z, w, d); gsap.set(el, { z: -lift, rotation: rot }); return el; };
  const svg = (vb, inner, x, z, w, d) => { const el = document.createElementNS("http://www.w3.org/2000/svg", "svg"); el.setAttribute("viewBox", vb); el.style.overflow = "visible"; el.innerHTML = inner; PG.appendChild(el); flat(el, x, z, w, d); return el; };
  // a dashed arrow printed on the page, pointing right (= outward)
  const dashArrow = (x0, x1, z) => { const w = x1 - x0; return svg(`0 0 ${w} 140`, `<path d="M10 70 H${w - 90} M${w - 130} 20 L${w - 40} 70 L${w - 130} 120" fill="none" stroke="#141414" stroke-opacity=".55" stroke-width="10" stroke-dasharray="26 18" stroke-linecap="round" stroke-linejoin="round"/>`, (x0 + x1) / 2, z, w, 140); };
  const drawIn = (el, t) => tl.fromTo(el, { scaleX: 0, autoAlpha: 0, transformOrigin: "0% 50%" }, { scaleX: 1, autoAlpha: 1, duration: 0.45, ease: "power2.out" }, t);

  // ---------- camera ----------
  Stage3D.install(tl, {
    duration: 12.5,
    cam: [
      [0, { x: 820, y: 600, z: -280, rx: -16, ry: -8, s: 1.0 }],
      [2.25, { x: 870, y: 600, z: -280, rx: -16, ry: -4, s: 1.03 }, "lin"],
      [2.95, { x: 2600, y: 600, z: -280, rx: -18, ry: 8, s: 1.0 }],          // follow the jump to the screen
      [4.65, { x: 2660, y: 600, z: -280, rx: -18, ry: 4, s: 1.04 }, "lin"],
      [5.3, { x: 4300, y: 800, z: -430, rx: -88, ry: 0, s: 0.62 }],           // 2D: top view, everything comes in
      [6.5, { x: 4300, y: 800, z: -430, rx: -88, ry: 4, s: 0.64 }, "lin"],
      [7.3, { x: 4300, y: 560, z: -250, rx: -26, ry: 16, s: 0.88 }],          // dive in: the ring becomes walls
      [8.6, { x: 4300, y: 580, z: -300, rx: -24, ry: 10, s: 0.92 }, "lin"],
      [9.25, { x: 4300, y: 660, z: -400, rx: -16, ry: 6, s: 1.3 }],           // push in on the proud square
      [10.15, { x: 4310, y: 660, z: -400, rx: -16, ry: 4, s: 1.33 }, "lin"],
      [10.95, { x: 5200, y: 520, z: -260, rx: -8, ry: -18, s: 0.88 }],         // swing out to the right: the steep steps
      [12.5, { x: 5220, y: 500, z: -260, rx: -10, ry: -14, s: 0.84 }, "lin"],
    ],
    shake: [[8.3, 4, 0.25], [11.3, 9, 0.4]],
  });

  // ---------- the square ----------
  const out = $("#out"), outIn = $("#outIn"), eyes = "#outIn .eye";
  const OX = 360, OZ = -230;
  stand(out, OX, OZ, 72, 72); flat($("#outSh"), OX, OZ, 110, 90);
  gsap.set(outIn, { transformOrigin: "50% 100%" });
  const at = (X, Z) => ({ x: X - OX, y: -(Z - OZ) });
  const hop = (t, X, Z, lift = 130, d = 0.36, landH = 0) => {
    const p = at(X, Z);
    tl.to(outIn, { scaleY: 0.75, scaleX: 1.15, duration: 0.09, ease: "power2.in" }, t - 0.09);
    tl.to([out, "#outSh"], { x: p.x, y: p.y, duration: d, ease: "none" }, t);
    tl.to(out, { z: -(lift + landH), duration: d / 2, ease: "power2.out" }, t);
    tl.to(outIn, { scaleY: 1.1, scaleX: 0.92, duration: d / 2 }, t);
    tl.to(out, { z: -landH, duration: d / 2, ease: "power2.in" }, t + d / 2);
    tl.to(outIn, { scaleY: 0.8, scaleX: 1.15, duration: 0.07 }, t + d);
    tl.to(outIn, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "elastic.out(1,0.45)" }, t + d + 0.07);
  };

  // ---------- A5·1 你说你在读书，是否有分享感悟？ ----------
  const BX = 600, BZ = -300;
  const pL = mk("pageL", lines(5, 34, 28)), pR = mk("pageR", lines(5, 34, 28));
  stand(pL, BX - 80, BZ, 170, 220, { yaw: 22 }); stand(pR, BX + 80, BZ, 170, 220, { yaw: -22 });
  const bookSh = mk("shr"); flat(bookSh, BX, BZ - 40, 380, 130);
  popUp(pL, 0.02, 0.45); popUp(pR, 0.08, 0.45);
  tl.to(eyes, { x: 7, y: 3, duration: 0.2 }, W("c01", "读"));
  const ar1 = dashArrow(790, 1190, BZ - 10);
  drawIn(ar1, W("c01", "分") - 0.05);
  const q1 = mk("qcard", "感悟<b>？</b>"); stand(q1, 1360, BZ, 250, 300, { yaw: -12 });
  popUp(q1, W("c01", "感") - 0.02, 0.5);
  paleBlock(240, -1250, 260, 160, 120); bgCard(620, -1420, 230, 300, 8); bgCard(1350, -1300, 250, 230, -8); paleBlock(1700, -1150, 300, 180, 90);
  fgCard(1760, -40, 300, 420, -18); fgFlat(250, 160, 700, 250, 0, 6);
  tl.fromTo("#photo", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25);
  tl.to("#photo", { autoAlpha: 0, duration: 0.25, ease: "power1.in" }, 4.55);

  // ---------- A5·2 你在学编程，是否有做出软件？ ----------
  const SXc = 2360, SZc = -320;
  block(PG, SXc, SZc + 40, 320, 170, 22, "linear-gradient(#e9e4da,#d9d2c4)");
  const codeLines = [["#E8430F", 40, 120], ["#fbf9f4", 70, 190], ["#8f8a80", 100, 150], ["#fbf9f4", 130, 210], ["#E8430F", 160, 90]];
  const scr = mk("screen", "<em>&lt;/&gt;</em>" + codeLines.map(([c, top, w], i) => `<i style="left:${24 + (i % 2) * 28}px;top:${top}px;width:${w}px;background:${c}"></i>`).join(""));
  stand(scr, SXc, SZc - 30, 310, 205); gsap.set(scr, { z: -22 });
  popUp(scr, 2.5, 0.45);
  tl.fromTo(scr.querySelectorAll("i"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.18, stagger: 0.1, ease: "power2.out" }, W("c02", "编"));
  hop(2.4, 2170, -190, 220, 0.5);
  const ar2 = dashArrow(2580, 2980, SZc);
  drawIn(ar2, W("c02", "做") - 0.05);
  const q2 = mk("qcard", "软件<b>？</b>"); stand(q2, 3140, SZc, 240, 250, { yaw: -12 });
  popUp(q2, W("c02", "软") - 0.02, 0.5);
  paleBlock(2150, -1300, 280, 170, 130); bgCard(2600, -1450, 240, 320, 6); bgCard(3150, -1350, 220, 260, -10);
  fgCard(1920, -30, 280, 420, 16); const fg2 = fgFlat(3050, 170, 700, 240, 0, -5);
  [pL, pR, q1, scr, q2].forEach((el, i) => foldDown(el, 5.0 + i * 0.03));
  tl.to([ar1, ar2, bookSh, fg2], { autoAlpha: 0, duration: 0.3 }, 5.0);

  // ---------- A6·1 向内输入是舒适的 (top view) ----------
  const RX = 4300, RZ = -420, RR = 420;
  const cush = mk("cushion"); flat(cush, RX, RZ, 260, 210);
  tl.fromTo(cush, { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 4.75);
  hop(4.75, RX, RZ, 420, 0.5, 0);
  const ring = svg("0 0 1000 1000", '<circle cx="500" cy="500" r="490" fill="none" stroke="#141414" stroke-opacity=".35" stroke-width="7" stroke-dasharray="30 22"/>', RX, RZ, RR * 2, RR * 2);
  tl.fromTo(ring, { autoAlpha: 0, rotation: -60 }, { autoAlpha: 1, rotation: 0, duration: 0.5, ease: "power3.out" }, 5.1);
  const inTxt = mk("print", "向内输入"); inTxt.style.color = "#141414"; flat(inTxt, RX, RZ - 800, 520, 110);
  printAt(inTxt, W("c03", "向") + 0.3);
  const INS = [["书", -1, 0], ["课", 1, 0], ["文章", 0, -1], ["视频", 0, 1]];
  INS.forEach(([w, dx, dz], i) => {
    const sx = RX + dx * 900, sz = RZ + dz * 520;
    const ar = svg("0 0 300 80", '<path d="M10 40 H230 M200 12 L250 40 L200 68" fill="none" stroke="#E8430F" stroke-width="9" stroke-dasharray="20 14" stroke-linecap="round" stroke-linejoin="round"/>', RX + dx * 600, RZ + dz * 360, 300, 80);
    gsap.set(ar, { rotation: dx === 1 ? 180 : dx === -1 ? 0 : dz === -1 ? -90 : 90 });
    tl.fromTo(ar, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 5.35 + i * 0.06);
    tl.to(ar, { autoAlpha: 0, duration: 0.3 }, 6.6);
    const m = mk("mini", w); flat(m, sx, sz, w.length > 1 ? 170 : 120, 110); gsap.set(m, { rotationX: 180 });
    const tx = (RX - sx) * 0.72, ty = -(RZ - sz) * 0.72;
    tl.fromTo(m, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, 5.4 + i * 0.12);
    tl.to(m, { x: tx, y: ty, duration: 0.8, ease: "power2.inOut" }, 5.55 + i * 0.12);
    tl.to(m, { autoAlpha: 0, scale: 0.6, duration: 0.25 }, 6.35 + i * 0.12);
  });
  const topSq = mk(""); Object.assign(topSq.style, { background: "#E8430F", borderRadius: "8px", boxShadow: "inset 0 -6px 0 rgba(0,0,0,.12)" });
  topSq.innerHTML = '<i style="position:absolute;left:20px;top:28px;width:10px;height:14px;background:#141414;border-radius:5px"></i><i style="position:absolute;left:42px;top:28px;width:10px;height:14px;background:#141414;border-radius:5px"></i>';
  flat(topSq, RX, RZ, 76, 76); gsap.set(topSq, { rotationX: 180, z: -2, autoAlpha: 0 });
  tl.to(topSq, { autoAlpha: 1, duration: 0.15 }, 5.2); tl.to(topSq.children, { scaleY: 0.2, duration: 0.15 }, W("c03", "舒"));
  tl.to(topSq, { autoAlpha: 0, duration: 0.2 }, 6.6);
  tl.to(eyes, { scaleY: 0.2, duration: 0.15 }, W("c03", "舒"));
  tl.to(outIn, { scaleY: 0.85, scaleX: 1.1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, W("c03", "舒"));
  tl.to(eyes, { scaleY: 1, duration: 0.15 }, 6.9);
  const fly = fgFlat(3500, 120, 480, 330, 430, 12); gsap.set(fly, { autoAlpha: 0 });
  tl.to(fly, { autoAlpha: 1, duration: 0.4 }, 5.1); tl.to(fly, { x: -700, z: -900, autoAlpha: 0, duration: 0.9, ease: "power2.in" }, 6.5);
  tl.to(inTxt, { autoAlpha: 0, duration: 0.3 }, 6.6);

  // ---------- A6·2 我们不必经受任何外部的考验 ----------
  const N = 16, WALLS = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2, el = mk("wall");
    stand(el, RX + RR * Math.cos(a), RZ + RR * Math.sin(a), 2 * Math.PI * RR / N + 6, 150, { yaw: -a * 180 / Math.PI - 90 });
    WALLS.push(el);
  }
  const tWall = W("c04", "不");
  WALLS.forEach((el, i) => popUp(el, tWall - 0.1 + i * 0.03, 0.45));
  tl.to(ring, { autoAlpha: 0, duration: 0.3 }, tWall + 0.2);
  const tOut = W("c04", "外"), tTest = W("c04", "考");
  [160, 200, 235, 270, 305].forEach((deg, i) => {
    const a = deg * Math.PI / 180, R2 = 760, el = mk("exam", "考验<s>✗</s><i></i><i></i><i></i>");
    stand(el, RX + R2 * Math.cos(a), RZ + R2 * Math.sin(a), 170, 220, { yaw: -deg - 90 });
    popUp(el, tOut - 0.15 + i * 0.06, 0.45);
    const L = 230, dx = -Math.cos(a) * L, dy = Math.sin(a) * L;
    tl.to(el, { x: dx, y: dy, duration: 0.2, ease: "power2.in" }, tTest + i * 0.03);
    tl.to(el, { x: 0, y: 0, duration: 0.45, ease: "back.out(2)" }, tTest + 0.2 + i * 0.03);
  });
  const fg3 = fgCard(3560, 120, 220, 340, 22); gsap.set(fg3, { autoAlpha: 0 }); tl.to(fg3, { autoAlpha: 1, duration: 0.3 }, 6.8);
  paleBlock(3700, -1500, 300, 170, 110); bgCard(4200, -1650, 260, 300, 4); bgCard(4800, -1550, 240, 240, -12); paleBlock(3300, -1300, 260, 160, 70);

  // ---------- A6·3 可以自我感觉良好 ----------
  const tSelf = W("c05", "自"), tGood = W("c05", "良");
  tl.to(outIn, { scale: 1.28, duration: 0.35, ease: "back.out(2)" }, tSelf);
  tl.to(eyes, { y: -3, duration: 0.2 }, tSelf);
  const good = mk("tag acc", "良好"); stand(good, RX + 10, RZ - 30, 170, 76); gsap.set(good, { z: -150 });
  popUp(good, tGood - 0.05, 0.45);
  [[-150, -60], [150, -80], [-110, 70], [130, 60]].forEach(([dx, dz], i) => {
    const st = mk("star"); stand(st, RX + dx, RZ + dz, 38, 38); gsap.set(st, { z: -120 - i * 25 });
    tl.fromTo(st, { autoAlpha: 0, scale: 0.2 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, tGood + 0.1 + i * 0.07);
    tl.to(st, { autoAlpha: 0, duration: 0.3 }, 10.1);
  });

  // ---------- A7·1 而向外输出就难多了 ----------
  const tTurn = W("c06", "而"), tOutp = W("c06", "向"), tHard = W("c06", "难");
  tl.to(eyes, { x: 8, y: 0, duration: 0.2 }, tTurn);
  tl.to(outIn, { scale: 1, duration: 0.25 }, tTurn);
  foldDown(good, tTurn + 0.05, 0.3);
  hop(tTurn + 0.12, 4790, RZ, 300, 0.5, 0);
  const STEP = ["向", "外", "输", "出", "", ""], SX0 = 4930, SW = 150, SH = 75;
  STEP.forEach((ch, i) => {
    const g = block(PG, SX0 + i * SW, RZ, SW, 280, SH * (i + 1), "linear-gradient(#fefdf9,#ece6da)");
    const f = g.querySelector(".front"); f.classList.add("step"); f.textContent = ch;
    gsap.set(g.children, { autoAlpha: 0 });   // opacity on the 3D group itself would flatten it
    tl.set(g.children, { autoAlpha: 1 }, tOutp + i * 0.07);
    tl.fromTo(g, { z: -(SH * (i + 1) + 700) }, { z: 0, duration: 0.38, ease: "bounce.out" }, tOutp + i * 0.07);
  });
  const door = mk("door2", '<div class="d"><div class="sg">处境</div><i class="k"></i></div>');
  stand(door, SX0 + 5 * SW, RZ - 120, 210, 340); gsap.set(door, { z: -SH * 6 });
  popUp(door, tOutp + 0.5, 0.5);
  const hard = mk("big", "难"); stand(hard, SX0 + 0.3 * SW, RZ - 520, 300, 300, { yaw: -10 });
  popUp(hard, tHard - 0.08, 0.4);
  hop(11.45, SX0, RZ, 170, 0.36, SH);
  const back = at(4800, RZ);
  tl.to(outIn, { rotation: -14, duration: 0.15 }, 12.0);
  tl.to(out, { x: back.x, y: back.y, z: 0, duration: 0.32, ease: "power2.in" }, 12.0);
  tl.to("#outSh", { x: back.x, y: back.y, duration: 0.32, ease: "power2.in" }, 12.0);
  tl.to(outIn, { rotation: 0, scaleY: 0.75, scaleX: 1.18, duration: 0.08 }, 12.32);
  tl.to(outIn, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "elastic.out(1,0.45)" }, 12.4);
  tl.to(eyes, { y: 4, duration: 0.2 }, 12.35);
  paleBlock(4900, -1350, 300, 180, 120); bgCard(5400, -1500, 260, 330, -6); paleBlock(5850, -1250, 260, 160, 80);
  fgCard(5950, 60, 300, 460, -24); fgFlat(4500, 260, 700, 260, 0, 6);
  tl.fromTo("#sticker", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 10.6);

  // ---------- captions ----------
  const KEY = { c01: "感悟", c02: "软件", c03: "舒适", c04: "考验", c05: "良好", c06: "难" };
  const SOFT = /[，。、；：,.;:…—]+/g, tidy = (t, last) => (last ? t.replace(SOFT, "") : t.replace(SOFT, " "));
  const caps = $("#caps");
  window.CAPS.forEach((c, ci) => {
    const el = document.createElement("div"); el.className = "cap"; caps.appendChild(el);
    el.innerHTML = c.u.map((u, i) => `<span class="c">${tidy(u[0], i === c.u.length - 1)}</span>`).join("");
    const next = window.CAPS[ci + 1];
    tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.18 }, Math.max(0, c.t0 - 0.12));
    tl.to(el, { opacity: 0, duration: 0.12 }, next ? next.t0 - 0.14 : 12.2);
    [...el.children].forEach((s, i) => tl.to(s, { color: KEY[c.id].includes(c.u[i][0][0]) ? "#E8430F" : "#141414", duration: 0.08 }, c.u[i][1]));
  });
  tl.fromTo("#tag", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5 }, 0.2);
  tl.to("#fade", { opacity: 1, duration: 0.3, ease: "power1.in" }, 12.2);
  gsap.set(["#photo", "#sticker"], { autoAlpha: 0 });

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
})();
</script>
