<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Series closing, 2.5 s: series name and account; sized to the stage, landscape or portrait */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f1ea; color: #1d1b18;
    font-family: "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif; }
  .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.4vmin; padding: 0 8vmin; text-align: center; }
  #series { font-size: 7vmin; font-weight: 800; }
  #account { font-size: 3.8vmin; color: #6d675c; }
  #rule { height: 0.7vmin; border-radius: 1vmin; background: #e0572d; }
</style>
</head>
<body>
<div class="stack">
  <div id="series">系列名</div>
  <div id="rule"></div>
  <div id="account">账号名</div>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.min(1, Math.max(0, x));
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
// 0 → 1 between a and b, eased
const span = (t, a, b) => out((t - a) / (b - a));

window.film = {
  duration: 2.5,
  ready: document.fonts.ready,
  frame(t) {
    const k = span(t, 0, 0.6);
    $('series').style.opacity = String(k);
    $('series').style.transform = `scale(${0.94 + 0.06 * k})`;
    $('rule').style.width = `${span(t, 0.3, 1.0) * 18}vmin`;
    $('account').style.opacity = String(span(t, 0.6, 1.1));
  },
};
</script>
</body>
</html>
